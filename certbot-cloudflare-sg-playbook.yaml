- name: Issue and renew SSL certificates
  hosts: server
  become: true
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Execute with error handling
      block:
        - name: Install certbot and cloudflare plugin
          apt:
            name: 
              - python3-certbot
              - python3-certbot-dns-cloudflare
            state: present
            update_cache: yes
          register: output1

        - name: Create .secrets directory if it doesn't exist
          file:
            path: "{{ ansible_facts['user_dir'] }}/.secrets"
            state: directory
            mode: "0700"  # Important: Restrict permissions for secrets
            owner: "{{ ansible_facts['user_id'] }}" # Ensure correct ownership
            group: "{{ ansible_facts['user_gid'] }}" # Ensure correct group ownership
          register: output2
          
        - name: Create cloudflare.ini file with token
          blockinfile: # Use blockinfile for formatted content
            path: "{{ ansible_facts['user_dir'] }}/.secrets/cloudflare.ini"
            create: yes  # Create the file if it doesn't exist
            block: |
              dns_cloudflare_api_token = {{ var_cloudflare_token }}
            mode: "0600"
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_gid'] }}"
          when: var_cloudflare_token is defined
          register: output3

        - name: Issue wildcard certificate for hosts that do not have one yet
          shell: >-
            certbot certonly
            --dns-cloudflare
            --dns-cloudflare-credentials {{ ansible_facts['user_dir'] }}/.secrets/cloudflare.ini
            --dns-cloudflare-propagation-seconds 120
            -d "*.{{ item }}"
            -m {{ var_certbot_mail }} 
            --agree-tos 
            -n
          args:
            chdir: "{{ ansible_facts['user_dir'] }}/.secrets"
            creates: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"  # Use item for creates path
          loop: "{{ groups['sslhosts'] }}"  # Iterate over the sslhosts group
          register: output4  # Register all results

        - name: Renew certificates that are due or already expired
          # certbot renew replays each certificate's stored settings from
          # /etc/letsencrypt/renewal/<domain>.conf (authenticator, credentials,
          # propagation seconds) and renews IN PLACE, so the live path stays
          # /etc/letsencrypt/live/<domain>/ and no -0001 lineage is created.
          command: certbot renew
          register: output5
          changed_when: "'No renewals were attempted' not in output5.stdout"

          
        # - name: Restart services
        #   systemd:
        #     name: "{{ item }}"
        #     state: restarted
        #   loop: "{{ groups['services'] }}" # Iterate through the 'services' group, provide empty list as default
        #   when: groups['services'] is defined # Only run this task if the group is defined.
        #   ignore_errors: yes # Optional: Continue even if a service restart fails
        #   register: output8 # Capture results for debugging

        - name: Sending an e-mail if tasks findished successfully
          become: no
          mail:
            host: "{{ var_gmail_smtp_server }}"
            port: "{{ var_gmail_smtp_port }}"
            username: "{{ var_gmail_sender }}"
            password: "{{ var_gmail_password }}"
            to: "{{ var_gmail_receiver }}"
            subject: 'Certbot OK on {{ inventory_hostname }} - {{ "certificates renewed" if output5.changed else "nothing due" }}'
            body: |
              Certbot run completed on {{ inventory_hostname }}.

              Result: {{ "one or more certificates were RENEWED" if output5.changed else "nothing was due for renewal" }}

              --- certbot renew output ---
              {{ output5.stdout }}
          delegate_to: 127.0.0.1
          register: output6

      rescue:
        - name: Sending an e-mail if any task failed
          become: no
          mail:
            host: "{{ var_gmail_smtp_server }}"
            port: "{{ var_gmail_smtp_port }}"
            username: "{{ var_gmail_sender }}"
            password: "{{ var_gmail_password }}"
            to: "{{ var_gmail_receiver }}"
            subject: Ansible task failed
            body: Ansible task failed for "{{ inventory_hostname }}" - "{{ ansible_failed_task }}".
          delegate_to: 127.0.0.1
          register: output7
      always:
        - name: Show debug messages
          debug:
            msg: "{{ item }}"
          with_items:
            - "{{ output1 | default(omit) }}"
            - "{{ output2 | default(omit) }}"
            - "{{ output3 | default(omit) }}"
            - "{{ output4 | default(omit) }}"
            - "{{ output5 | default(omit) }}"
            # - "{{ output8 | default(omit) }}"
            - "{{ output6 | default(omit) }}"
            - "{{ output7 | default(omit) }}"
